[project]
name = "table-ronde"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "art0-v1r0s", email = "arthurd2000@gmil.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.16.0",
    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-openai>=1.6.2",
    "langchain-anthropic>=0.3.0",
    "langchain-ollama>=0.3.0",
    "typesafe-sdk>=0.1.0",
    "pathspec>=1.1.1",
    "pydantic>=2.13.5",
    "pyfiglet>=1.0.2",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "textual>=8.2.8",
    "typer>=0.27.2",
]

[project.scripts]
table-ronde = "table_ronde.cli:app"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.25.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.7",
    "textual-dev>=1.7.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff.lint]
ignore = ["B008", "BLE001", "S110", "SIM102"]

[tool.pytest.ini_options]
testpaths = ["tests"]

