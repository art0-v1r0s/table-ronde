orchestrator:
  rounds: 2
  default_provider: gemini
  default_model: gemini-3.6-flash

architect:
  role: architect
  title: "The Architect"
  emoji: "🏛️"
  temperature: 0.1
  prompt: "You are the Architect. Keep your responses ultra-short for this test."

personas:
  - role: skeptic
    title: "The Skeptic"
    emoji: "😈"
    temperature: 0.2
    prompt: "You are the Skeptic. Be very brief. Just write one sentence of criticism."
  - role: enthusiast
    title: "The Enthusiast"
    emoji: "🚀"
    temperature: 0.3
    prompt: "You are the Enthusiast. Be very brief. Just write one positive sentence."
  - role: security
    title: "Security Expert"
    emoji: "🛡️"
    temperature: 0.1
    prompt: "You are the Security Expert. Just write one sentence warning about security."
